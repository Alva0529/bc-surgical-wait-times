[pytest]
testpaths = tests

# -ra prints the reason for every skip. A current-data assertion that quietly
# does not run is worse than one that fails.
#
# --strict-markers turns a misspelled marker into an error. Without it,
# @pytest.mark.realdta registers nothing, and the test runs against a warehouse
# that may not be there.
addopts = -ra --strict-markers

markers =
    realdata: reads data/warehouse.duckdb, built from the published files. Skipped when it is absent, which is the normal case in CI.
